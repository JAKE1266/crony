[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crony"
version = "1.0.0"
description = "crony —— cron 表达式解析与下次执行时间计算的零依赖命令行工具(Vixie 子集,支持 --explain 人话解释)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JAKE1266" }]
keywords = ["cron", "crontab", "scheduler", "parser", "cli", "next-run"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/JAKE1266/crony"
Issues = "https://github.com/JAKE1266/crony/issues"

[project.scripts]
crony = "crony.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
